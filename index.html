<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>품절각 링크 모음</title>
<meta name="description" content="품절각 영상 속 상품 링크 모음 — 영상에 나온 번호로 찾으세요">
<link rel="icon" href="img/avatar.png">
<style>
:root{--red:#e61e1e;--ink:#141414;--sub:#777;--bg:#f6f6f6;--card:#fff;--yellow:#ffd600}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);
font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
header{background:var(--red);padding:22px 16px 18px;text-align:center;color:#fff}
.avatar{width:84px;height:84px;border-radius:50%;border:4px solid #fff;background:var(--yellow);object-fit:cover}
h1{margin:8px 0 2px;font-size:24px}header p{margin:0;font-size:13px;opacity:.9}
.disc{font-size:11.5px;color:#fff;opacity:.85;margin-top:8px}
.wrap{max-width:560px;margin:0 auto;padding:14px 16px 40px}
.search{position:sticky;top:0;z-index:2;background:var(--bg);padding:10px 0}
.search input{width:100%;padding:14px 18px;font-size:17px;border:3px solid var(--ink);border-radius:999px;outline:none}
.hint{font-size:13px;color:var(--sub);margin:4px 6px 0}
.card{display:flex;gap:12px;background:var(--card);border-radius:18px;padding:12px;margin-top:12px;
box-shadow:0 2px 0 rgba(0,0,0,.08);align-items:center}
.thumb{position:relative;flex:0 0 92px;height:92px;border-radius:12px;overflow:hidden;background:#ddd}
.thumb img{width:100%;height:100%;object-fit:cover;object-position:center 30%}
.no{position:absolute;left:0;top:0;background:var(--yellow);color:var(--ink);font-weight:900;font-size:20px;
padding:2px 9px;border-bottom-right-radius:12px}
.body{flex:1;min-width:0}.title{font-weight:800;font-size:17px;margin:0 0 6px}
.btn{display:block;text-decoration:none;background:var(--red);color:#fff;font-weight:700;font-size:15px;
padding:11px 14px;border-radius:12px;margin-top:6px}
.btn span{float:right}.empty{text-align:center;color:var(--sub);margin-top:40px}
footer{text-align:center;font-size:12px;color:var(--sub);padding:0 16px 30px}
</style></head><body>
<header><img class="avatar" src="img/avatar.png" alt="품절각">
<h1>품절각 링크 모음</h1><p>영상에 나온 <b>번호</b>로 찾으세요</p>
<div class="disc">이 페이지는 쿠팡 파트너스 활동의 일환으로, 이에 따른 일정액의 수수료를 제공받습니다.</div></header>
<div class="wrap">
<div class="search"><input id="q" inputmode="search" placeholder="번호나 상품명 (예: 6, 가습기)" autocomplete="off">
<div class="hint">최신 영상이 맨 위에 있어요</div></div>
<div id="list"></div></div>
<footer>@pumjeol.gak · YouTube @puljeolgak<br>이 페이지는 쿠팡 파트너스 활동의 일환으로, 이에 따른 일정액의 수수료를 제공받습니다.</footer>
<script>
const DATA = [{"no": 7, "title": "충전식 보풀제거기", "items": [{"name": "충전식 보풀제거기", "link": "https://link.coupang.com/a/hWWn2iVYBM"}], "img": "img/7.jpg"}, {"no": 6, "title": "불멍 가습기", "items": [{"name": "불멍 가습기", "link": "https://link.coupang.com/a/hWV6neHm6S"}], "img": "img/6.jpg"}, {"no": 5, "title": "결로방지 물흡수 테이프", "items": [{"name": "결로방지 물흡수 테이프", "link": "https://link.coupang.com/a/hWWpVSMyaW"}], "img": "img/5.jpg"}];
const list = document.getElementById("list"), q = document.getElementById("q");
function render() {
  const s = q.value.trim().replace(/번$/, "");
  const rows = DATA.filter(v => !s || String(v.no) === s || (v.title + v.items.map(i => i.name).join(" ")).includes(s));
  list.replaceChildren(...rows.map(v => {
    const c = document.createElement("div"); c.className = "card";
    const t = document.createElement("div"); t.className = "thumb";
    if (v.img) { const im = document.createElement("img"); im.src = v.img; im.alt = ""; im.loading = "lazy"; t.append(im); }
    const no = document.createElement("div"); no.className = "no"; no.textContent = v.no; t.append(no);
    const b = document.createElement("div"); b.className = "body";
    const h = document.createElement("p"); h.className = "title"; h.textContent = v.title; b.append(h);
    for (const it of v.items) {
      const a = document.createElement("a"); a.className = "btn"; a.href = it.link; a.target = "_blank";
      a.rel = "sponsored nofollow noopener";
      a.textContent = v.items.length > 1 ? it.name : "쿠팡에서 보기";
      const r = document.createElement("span"); r.textContent = "→"; a.append(r); b.append(a);
    }
    c.append(t, b); return c;
  }));
  if (!rows.length) list.innerHTML = '<p class="empty">찾는 번호가 없어요. 최신 영상 번호를 확인해 주세요</p>';
}
q.addEventListener("input", render);
const m = location.hash.match(/^#(\d+)$/); if (m) q.value = m[1];
render();
</script></body></html>
