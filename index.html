:root{--red:#4a3424;--ink:#3b2a1e;--sub:#9a8572;--bg:#f7f1e8;--card:#fffdf9;--yellow:#e9d8c2}

.wrap{max-width:560px;margin:0 auto;padding:14px 16px 40px}
.search{position:sticky;top:0;z-index:2;background:var(--bg);padding:10px 0}

.search input:focus{border-color:var(--red)}

.no{position:absolute;left:0;top:0;background:var(--yellow);color:var(--ink);font-weight:900;font-size:22px;

.body{display:flex;flex-direction:column;flex:1;min-width:0}
.title{font-weight:800;font-size:15px;margin:8px 2px 4px;line-height:1.3;flex:1}
.btn{display:block;text-decoration:none;background:var(--red);color:#fff;font-weight:700;font-size:14px;

.btn span{float:right}.empty{grid-column:1/-1;text-align:center;color:var(--sub);margin-top:40px}

{"no": 4, "title": "곰팡이 제거 젤", "items": [{"name": "곰팡이 제거 젤", "link": "https://link.coupang.com/a/hW8r3HKTPo"}], "img": "img/4.jpg"}];
const list = document.getElementById("list"), q = document.getElementById("q");
function render() {
  const s = q.value.trim().replace(/번$/, "");
  const rows = DATA.filter(v => !s || String(v.no) === s || (v.title + v.items.map(i => i.name).join(" ")).includes(s));
  list.replaceChildren(...rows.map(v => {
    const c = document.createElement("div"); c.className = "card";
    const t = document.createElement("div"); t.className = "thumb";
    if (v.img) { const im = document.createElement("img"); im.src = v.img; im.alt = ""; im.loading = "lazy"; t.append(im); }
    const no = document.createElement("div"); no.className = "no"; no.textContent = v.no; t.append(no);
    const b = document.createElement("div"); b.className = "body";
    const h = document.createElement("p"); h.className = "title"; h.textContent = v.title; b.append(h);
    for (const it of v.items) {
      const a = document.createElement("a"); a.className = "btn"; a.href = it.link; a.target = "_blank";
      a.rel = "sponsored nofollow noopener";
      a.addEventListener("click", () => track("coupang_click", {item_no: v.no, item_name: (v.title + " " + it.name).slice(0, 90)}));
      a.textContent = v.items.length > 1 ? it.name : "구매하기";
      const r = document.createElement("span"); r.textContent = "→"; a.append(r); b.append(a);
    }
    c.append(t, b); return c;
  }));
  if (!rows.length) list.innerHTML = '<p class="empty">찾는 번호가 없어요. 최신 영상 번호를 확인해 주세요</p>';
}
q.addEventListener("input", render);
q.addEventListener("change", () => q.value && track("search", {search_term: q.value.slice(0, 40)}));
function track(name, p) { if (window.gtag) gtag("event", name, Object.assign({transport_type: "beacon"}, p)); }
const m = location.hash.match(/^#(\d+)$/); if (m) q.value = m[1];
render();
</script></body></html>
